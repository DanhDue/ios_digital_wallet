name: iOS CI

on:
  pull_request: {}
  push:
    branches: [develop, main]

# No signing secrets are used anywhere in this workflow. Every build runs with
# CODE_SIGNING_ALLOWED=NO.

jobs:
  quality:
    name: Quality (lint, format, boundaries, ArchTests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install pinned toolchain (tuist, swiftlint, swiftformat)
        run: mise install

      # SwiftLint / SwiftFormat resolve the paths inside quality/*.yml relative
      # to the quality/ directory, so both MUST run from the repo root.
      - name: SwiftLint (strict)
        run: swiftlint lint --strict --config quality/.swiftlint.yml

      - name: SwiftFormat (lint)
        run: swiftformat --config quality/.swiftformat . --lint

      - name: Module boundary guard
        run: bash scripts/check_module_boundaries.sh

      - name: ArchTests
        run: swift test --package-path ArchTests

  packages:
    name: Local package tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Skeleton: no local packages exist yet. The loop is a guarded no-op and
      # the job passes. Phase 1 adds Packages/{Core,Framework,Network,AppUIKit,
      # Platform,Shell} and Packages/Features/*.
      - name: Test every local package (if any)
        run: |
          shopt -s nullglob
          tested=0
          for dir in Packages/* Features/*; do
            [ -f "$dir/Package.swift" ] || continue
            tested=1
            echo "== swift test --package-path $dir =="
            swift test --package-path "$dir"
          done
          if [ "$tested" -eq 0 ]; then
            echo "No local packages yet — nothing to test (Phase 1 adds Packages/*)."
          fi

  app:
    name: App build / test
    runs-on: macos-15
    needs: [quality, packages]
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install pinned toolchain (tuist)
        run: mise install

      - name: Resolve SPM dependencies
        run: tuist install

      - name: Generate the Xcode project
        run: tuist generate --no-open

      # There are no test targets yet (Phase 0). Try `xcodebuild test`; if it
      # fails only because there is nothing to test, fall back to a plain build.
      # Real test targets arrive in Phase 1.
      - name: Build & test the app
        run: |
          set -o pipefail
          destination='platform=iOS Simulator,name=iPhone 16,OS=latest'
          if xcodebuild test \
              -workspace iOSDigitalWallet.xcworkspace \
              -scheme iOSDigitalWallet \
              -destination "$destination" \
              CODE_SIGNING_ALLOWED=NO; then
            echo "xcodebuild test succeeded."
          else
            echo "xcodebuild test failed (expected until Phase 1 adds test targets) — building instead."
            xcodebuild build \
              -workspace iOSDigitalWallet.xcworkspace \
              -scheme iOSDigitalWallet \
              -destination "$destination" \
              CODE_SIGNING_ALLOWED=NO
          fi
