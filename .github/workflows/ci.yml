name: iOS CI

on:
  pull_request: {}
  push:
    branches: [develop, main]

# No signing secrets are used anywhere in this workflow. Every build runs with
# CODE_SIGNING_ALLOWED=NO.

jobs:
  quality:
    name: Quality (lint, format, boundaries, ArchTests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install pinned toolchain (tuist, swiftlint, swiftformat)
        run: mise install

      # SwiftLint / SwiftFormat resolve the paths inside quality/*.yml relative
      # to the quality/ directory, so both MUST run from the repo root.
      - name: SwiftLint (strict)
        run: swiftlint lint --strict --config quality/.swiftlint.yml

      - name: SwiftFormat (lint)
        run: swiftformat --config quality/.swiftformat . --lint

      - name: Module boundary guard
        run: bash scripts/check_module_boundaries.sh

      - name: ArchTests
        run: swift test --package-path ArchTests

  packages:
    name: Local package tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Skeleton: no local packages exist yet. The loop is a guarded no-op and
      # the job passes. Phase 1 adds Packages/{Core,Framework,Network,AppUIKit,
      # Platform,Shell} and Packages/Features/*.
      - name: Test every local package (if any)
        run: |
          shopt -s nullglob
          tested=0
          for dir in Packages/* Features/*; do
            [ -f "$dir/Package.swift" ] || continue
            tested=1
            echo "== swift test --package-path $dir =="
            swift test --package-path "$dir"
          done
          if [ "$tested" -eq 0 ]; then
            echo "No local packages yet — nothing to test (Phase 1 adds Packages/*)."
          fi

  app:
    name: App build / test
    runs-on: macos-15
    needs: [quality, packages]
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install pinned toolchain (tuist)
        run: mise install

      - name: Resolve SPM dependencies
        run: tuist install

      - name: Generate the Xcode project
        run: tuist generate --no-open

      # App/Tests/AppTests and App/UITests are real test targets wired into the
      # scheme's testAction; a failure here must fail the job (governance 4.2).
      - name: Build & test the app
        run: |
          set -o pipefail

          # Pin by platform, not by device model name. `xcodebuild test`
          # requires a concrete simulator (a generic/platform destination is
          # rejected for the test action), but hard-coding a model name (e.g.
          # the previous "iPhone 16") rots the moment Apple renames or drops
          # that generation from the default simulator set — which is exactly
          # what happened here. Ask the installed Xcode for any available
          # iPhone simulator instead, choosing the newest installed iOS
          # runtime by numeric [major, minor] comparison (not a lexicographic
          # string sort, which misorders single- vs double-digit majors), and
          # select that device by its own UDID so the device and its OS
          # version can never disagree with each other — there is no separate
          # "OS=latest" re-qualification step to drift out of sync.
          selection=$(xcrun simctl list devices available -j | jq -r '
            [
              .devices
              | to_entries
              | map(select(.key | test("\\.iOS-[0-9]+-[0-9]+$")))
              | sort_by(.key | capture("iOS-(?<maj>[0-9]+)-(?<min>[0-9]+)")
                              | [(.maj | tonumber), (.min | tonumber)])
              | reverse[]
              | .value[]
              | select(.name | startswith("iPhone"))
            ][0]
            | if . == null then empty else "\(.name)\t\(.udid)" end
          ')
          if [ -z "$selection" ]; then
            echo "::error::No available iPhone simulator found on this runner."
            exit 1
          fi
          device_name="${selection%%$'\t'*}"
          device_udid="${selection##*$'\t'}"
          destination="platform=iOS Simulator,id=$device_udid"
          echo "Using destination: $destination (device: $device_name)"

          xcodebuild test \
            -workspace iOSDigitalWallet.xcworkspace \
            -scheme iOSDigitalWallet \
            -destination "$destination" \
            -only-testing:iOSDigitalWalletTests \
            CODE_SIGNING_ALLOWED=NO

  plugin-devbed:
    name: Plugin DevBed verification
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install pinned toolchain (tuist)
        run: mise install

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Plugin mode
        run: ./scripts/configure_mode.sh plugin

      - name: Build & test Plugin package
        run: |
          selection=$(xcrun simctl list devices available -j | jq -r '
            [
              .devices
              | to_entries
              | map(select(.key | test("\\.iOS-[0-9]+-[0-9]+$")))
              | sort_by(.key | capture("iOS-(?<maj>[0-9]+)-(?<min>[0-9]+)")
                              | [(.maj | tonumber), (.min | tonumber)])
              | reverse[]
              | .value[]
              | select(.name | startswith("iPhone"))
            ][0]
            | if . == null then empty else "\(.name)\t\(.udid)" end
          ')
          if [ -z "$selection" ]; then
            echo "::error::No available iPhone simulator found on this runner."
            exit 1
          fi
          device_udid="${selection##*$'\t'}"
          destination="platform=iOS Simulator,id=$device_udid"

          (cd Plugin && xcodebuild build -scheme Plugin -destination "$destination" CODE_SIGNING_ALLOWED=NO)
          (cd Plugin && xcodebuild test -scheme Plugin -destination "$destination" CODE_SIGNING_ALLOWED=NO)

      - name: Build & test Sample runner
        run: |
          selection=$(xcrun simctl list devices available -j | jq -r '
            [
              .devices
              | to_entries
              | map(select(.key | test("\\.iOS-[0-9]+-[0-9]+$")))
              | sort_by(.key | capture("iOS-(?<maj>[0-9]+)-(?<min>[0-9]+)")
                              | [(.maj | tonumber), (.min | tonumber)])
              | reverse[]
              | .value[]
              | select(.name | startswith("iPhone"))
            ][0]
            | if . == null then empty else "\(.name)\t\(.udid)" end
          ')
          device_udid="${selection##*$'\t'}"
          destination="platform=iOS Simulator,id=$device_udid"

          xcodebuild build -workspace PluginDevbed.xcworkspace -scheme Sample -destination "$destination" CODE_SIGNING_ALLOWED=NO
          xcodebuild test -workspace PluginDevbed.xcworkspace -scheme Sample -destination "$destination" CODE_SIGNING_ALLOWED=NO

