# Mason brick registry for the iOS Super App Template (Source Spec §10).
#
# Four bricks — parity with the Android template's
# `bricks/{mvi_feature,mvi_subfeature,remove_feature,remove_subfeature}`:
#
#   ios_mvi_feature       --name X [--has_network true]
#       Scaffolds Features/X/ (Data/Domain/Presentation + tests),
#       then auto-wires it into Tuist/Package.swift and Project.swift inside the
#       // tuist:packages:begin/end and // tuist:app-deps:begin/end regions.
#
#   ios_mvi_subfeature    --feature X --name Y
#       Adds Presentation/Y/* to an existing X package. No manifest edit.
#
#   ios_remove_feature    --name X
#       Exact inverse of ios_mvi_feature: deletes the package and removes both
#       manifest lines. Idempotent (a second run is a clean no-op).
#
#   ios_remove_subfeature --feature X --name Y
#       Deletes Presentation/Y/ and its test from X.
#
# Usage:  mason get   (once, to resolve)   then   mason make <brick> ...
bricks:
  ios_mvi_feature:
    path: bricks/ios_mvi_feature
  ios_mvi_subfeature:
    path: bricks/ios_mvi_subfeature
  ios_remove_feature:
    path: bricks/ios_remove_feature
  ios_remove_subfeature:
    path: bricks/ios_remove_subfeature
